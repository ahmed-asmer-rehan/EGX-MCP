[project]
name = "egx-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "holidays>=0.97",
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "retry>=0.9.2",
    "typer>=0.15.1",
    "tvdatafeed",
]

[project.scripts]
egx = "egx_cli.app:main"

[tool.uv.sources]
tvdatafeed = { git = "https://github.com/rongardF/tvdatafeed.git", rev = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["egx_cli", "Domain"]
